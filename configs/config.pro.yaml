# =============================================================================
# Image Service - Production Configuration
# =============================================================================
# Values can be overridden by environment variables.
# Viper automatically maps: mongo.host -> MONGO_HOST, s3.endpoint -> S3_ENDPOINT, etc.

logger:
  level: info
  development: false

server:
  port: 8080

mongo:
  host: mongo
  port: 27017
  username: admin
  password: ""
  database: images
  replica-set: rs0
  migrations:
    enabled: true
    auto-migrate: true

observability:
  otel-collector-endpoint: http://otel-collector:4317
  tracing:
    enabled: true
  metrics:
    enabled: true

application:
  presign-ttl: 15m # Presigned URL validity duration
  max-upload-bytes: 5242880 # 5 MB - maximum upload size
  jwt-secret: ""
  promote:
    small-width: 400
    large-width: 800
    quality: 85

security:
  token:
    public-key: ""

kafka:
  brokers: kafka:29092
  schema-registry:
    url: http://schema-registry:8081
    auto-register-schemas: true
  producers-config:
    producers:
      - name: product-image-events
        topic: image.product-image.events
  consumers-config:
    default-group-id: ecommerce-image-service
    default-auto-offset-reset: earliest
    consumers:
      - name: product-events
        topic: catalog.product.events

s3:
  endpoint: http://minio:9000
  public-endpoint: ""
  access-key-id: minioadmin
  secret-key: ""
  bucket: ecommerce-images
  region: us-east-1
  use-ssl: false

imgproxy:
  public-base-url: ""
  key-hex: ""
  salt-hex: ""
