# =============================================================================
# Image Service - Production Configuration
# =============================================================================
# Values can be overridden by environment variables.
# Viper automatically maps: mongo.host -> MONGO_HOST, s3.endpoint -> S3_ENDPOINT, etc.

mongo:
  host: ""
  username: ""
  password: ""
  database: images
  replica-set: ""

observability:
  otel-collector-endpoint: ""
  tracing:
    enabled: true
  metrics:
    enabled: true

security:
  token:
    public-key: ""

kafka:
  brokers: ""
  schema-registry:
    url: ""
    auto-register-schemas: true
  consumers-config:
    default-group-id: "ecommerce-image-service"
    default-auto-offset-reset: "earliest"
    consumers:
      - name: "catalog-events"
        topic: "catalog.product.events"

application:
  presign-ttl: 15m # Presigned URL validity duration
  max-upload-bytes: 5242880 # 5 MB - maximum upload size
  jwt-secret: ""
  promote:
    small-width: 400
    large-width: 800
    quality: 85

s3:
  endpoint: ""
  public-endpoint: ""
  region: ""
  bucket: ""
  access-key-id: ""
  secret-key: ""
  use-path-style: true

imgproxy:
  public-base-url: ""
  key-hex: ""
  salt-hex: ""
